<!-- Main navigation module: contains header, logo, nav menu, resume download, and theme toggle. -->
<header id="mod-nav">
  <nav class="navbar" id="navbar" role="navigation" aria-label="Navegación principal">
    <!-- [ Main bar ] -->
    <div class="nav-container">
      <!-- Logo -->
      <a href="#home" class="nav-logo" aria-label="Ir al inicio">
        <span class="logo-j">Jose</span><span class="logo-dot">.dev</span>
      </a>

      <!-- Navigation links (desktop) -->
      <ul class="nav-links" role="menubar">
        <li role="none">
          <a href="#about" role="menuitem" data-i18n="nav.about">Mi Historia</a>
        </li>
        <li role="none">
          <a href="#tools" role="menuitem" data-i18n="nav.tools">Herramientas</a>
        </li>
        <li role="none">
          <a href="#projects" role="menuitem" data-i18n="nav.projects">Creaciones</a>
        </li>
        <li role="none"><a href="#contact" role="menuitem" data-i18n="nav.contact">Jose!</a></li>
      </ul>

      <!-- Actions: resume + theme toggle -->
      <div class="nav-actions">

        <!-- Download resume -->
        <a href="https://drive.google.com/file/d/1oxZCy5gaQsItZhOWaGPISaK9y2Bvln7J/view?usp=sharing" class="btn-cv"
          aria-label="Descargar CV">
          <i class="fas fa-file-code" aria-hidden="true"></i> <span data-i18n="nav.resume">CV Curriculum</span>
        </a>

        <!-- Language toggle button -->
        <button class="lang-btn" id="langToggle" aria-label="Cambiar idioma a Inglés" title="Cambiar a Inglés">
          <span class="lang-text">EN</span>
        </button>

        <!-- Light/dark mode button -->
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema claro/oscuro">
          <span class="toggle-track" aria-hidden="true">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
            <span class="toggle-thumb"></span>
          </span>
        </button>
      </div>

      <!-- Hamburger button (mobile) --->
      <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <!-- /nav-container -->

    <!-- [ Mobile dropdown menu ] -->
    <div class="mobile-menu" id="mobileMenu" role="menu" aria-hidden="true">
      <!-- Mobile actions (theme toggle visible on small screens) -->
      <div class="mobile-menu-actions">
        <!-- Language toggle button (mobile) -->
        <button class="lang-btn" id="langToggleMobile" aria-label="Cambiar idioma a Inglés (móvil)" title="Cambiar a Inglés">
          <span class="lang-text">EN</span>
        </button>

        <button class="theme-toggle" aria-label="Cambiar tema claro/oscuro (móvil)">
          <span class="toggle-track" aria-hidden="true">
            <i class="fas fa-sun sun-icon"></i>
            <i class="fas fa-moon moon-icon"></i>
            <span class="toggle-thumb"></span>
          </span>
        </button>
      </div>
      <ul>
        <li><a href="#about" role="menuitem"><i class="fas fa-user-astronaut"></i> <span data-i18n="nav.about">Mi Historia</span></a></li>
        <li><a href="#tools" role="menuitem"><i class="fas fa-toolbox"></i> <span data-i18n="nav.tools">Herramientas</span></a></li>
        <li><a href="#projects" role="menuitem"><i class="fas fa-rocket"></i> <span data-i18n="nav.projects">Creaciones</span></a></li>
        <li><a href="#contact" role="menuitem"><i class="fas fa-envelope"></i> <span data-i18n="nav.contact">Contacto</span></a></li>

        <!-- Download resume -->
        <li role="none">
          <a href="https://drive.google.com/file/d/1oxZCy5gaQsItZhOWaGPISaK9y2Bvln7J/view?usp=sharing" class="btn-cv"
            aria-label="Descargar CV">
            <i class="fas fa-file-code" aria-hidden="true"></i> <span data-i18n="nav.resume">CV Curriculum</span>
          </a>
        </li>
      </ul>

    <!-- /mobile-menu -->
  </nav>

<!-- /mod-nav -->
